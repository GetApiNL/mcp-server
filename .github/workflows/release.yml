name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Typecheck
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
      
      - name: Tests (unit + e2e, met coverage-thresholds)
        run: npm run test:coverage
      
      - name: Package smoke test (gepubliceerd artefact)
        run: npm run test:package
      
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.NPM_TOKEN }}
      
      - name: Set version
        run: |
          VERSION=${{ github.ref_name }}
          echo "Package version: $VERSION"
      
      - name: Update package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            pkg.mcpName = '$VERSION' === '0.2.0' ? 'io.github.willemoostra/getapi-mcp' : pkg.mcpName;
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      
      - name: Update server.json
        run: |
          node -e "
            const server = {
              'io.github.willemoostra/getapi-mcp': {
                name: 'getapi-mcp',
                version: '$VERSION',
                command: 'npx',
                args: ['getapi-mcp']
              }
            };
            require('fs').writeFileSync('server.json', JSON.stringify(server, null, 2));
          "
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json server.json
          git commit -m "Update for v$VERSION release" || true
      
      - name: Push changes
        run: |
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Publish to MCP registry
        run: npx mcp-publisher publish
        env:
          MCP_PUBLISHER_TOKEN: ${{ secrets.MCP_PUBLISHER_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Create GitHub release
        run: |
          node -e "
            const releaseData = {
              tag_name: '${{ github.ref_name }}',
              name: \`GetApi MCP Server \${{ github.ref_name }}\`,
              body: \`Automated release from tag \${{ github.ref_name }}\`
            };
            console.log(JSON.stringify(releaseData));
          "
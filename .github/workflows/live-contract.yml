name: Live contract test

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: live-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-contract:
    name: Live API contract test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Zonder key slaat het script zichzelf over (exit 0). Voorkeur: een secret.
      # Valt terug op de repository variable DEPLOYMENT_GETAPI_KEY.
      - name: Live contract test
        env:
          API_KEY: ${{ secrets.GETAPI_API_KEY || vars.DEPLOYMENT_GETAPI_KEY }}
        run: npm run test:live
